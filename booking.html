<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service | Ayya Two Wheelers Workshop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo"><img src="image/logo.png" alt="Ayya Two Wheelers Workshop"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a href="tel:7540081247" class="book-btn">Call Now</a>
    </header>

    <main>
        <section class="contact-section">
            <div>
                <span>Booking</span>
                <h1>Book a service slot.</h1>
                <p>Share your bike details and preferred timing. For urgent repair or same-day service, calling is the fastest option.</p>
                <a class="inline-call" href="tel:7540081247"><i class="fa-solid fa-phone"></i> 7540081247</a>
            </div>
            <form class="contact-form">
                <input type="text" placeholder="Full name" aria-label="Full name">
                <input type="tel" placeholder="Phone number" aria-label="Phone number">
                <input type="text" placeholder="Bike / scooter model" aria-label="Bike or scooter model">
                <select aria-label="Preferred service">
                    <option>General service</option>
                    <option>Oil change</option>
                    <option>Brake service</option>
                    <option>Electrical repair</option>
                    <option>Engine repair</option>
                </select>
                <textarea placeholder="Preferred date, time, and issue" aria-label="Preferred date time and issue"></textarea>
                <button type="submit">Request Booking</button>
            </form>
        </section>
    </main>

    <footer class="site-footer simple-footer"><p>&copy; 2026 Ayya Two Wheelers Workshop. All rights reserved.</p></footer>
</body>
</html>
