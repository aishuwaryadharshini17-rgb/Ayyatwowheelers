<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | AYYA Workshop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .login-box {
            width: 380px;
            padding: 35px;
            background: #1c1c1c;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 15px;
        }

        h1 {
            color: #fff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            color: #ddd;
            display: block;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #292929;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #e00000;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #e00000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #b80000;
        }

        .error {
            color: #ff5555;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- If logo.png exists in image folder -->
        <a href="../index.html" aria-label="Go to home page">
            <img src="../image/logo.png" class="logo" alt="AYYA Workshop">
        </a>

        <h1>Admin Login</h1>

        <p class="subtitle">AYYA Two Wheeler Workshop</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="enter username"
                    required
                >
            </div>

            <div class="input-group">
                <label>password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                LOGIN
            </button>

            <p class="error" id="errorMessage">
                Invalid username or password
            </p>

        </form>

    </div>

    
<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (username === "yogesh" && password === "ayya123") {

        window.location.href = "dashboard.html";

    } else {

        const errorMessage = document.getElementById("errorMessage");
        errorMessage.textContent = "Invalid username or password";
        errorMessage.style.display = "block";

    }
});
</script>
</body>
</html>
