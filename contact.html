<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ayya Two Wheelers Workshop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo"><img src="image/logo.png" alt="Ayya Two Wheelers Workshop"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a href="tel:7540081247" class="book-btn">Call Now</a>
    </header>

    <main>
        <section class="contact-section">
            <div>
                <span>Contact</span>
                <h1>Visit or call the workshop.</h1>
                <p><i class="fa-solid fa-phone"></i> <a href="tel:7540081247">7540081247</a></p>
                <p><i class="fa-solid fa-envelope"></i> info@ayyatwowheelers.com</p>
                <p><i class="fa-solid fa-clock"></i> Mon-Sat: 9.30 AM - 9.30 PM</p>
                <p><i class="fa-solid fa-location-dot"></i> Jeyam complex, Podhumbu main road, Prc colony 2 street, Madurai-18</p>
            </div>
            <form class="contact-form">
                <input type="text" placeholder="Your name" aria-label="Your name">
                <input type="tel" placeholder="Phone number" aria-label="Phone number">
                <select aria-label="Service type">
                    <option>General service</option>
                    <option>Repair work</option>
                    <option>Electrical work</option>
                    <option>Engine tune-up</option>
                </select>
                <textarea placeholder="Bike model and service details" aria-label="Service details"></textarea>
                <button type="submit">Send Enquiry</button>
            </form>
        </section>
    </main>

    <footer class="site-footer simple-footer"><p>&copy; 2026 Ayya Two Wheelers Workshop. All rights reserved.</p></footer>
</body>
</html>
